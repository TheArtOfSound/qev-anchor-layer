name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Use package.json packageManager field only (avoid dual version pin).

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS deps (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build SDK (CLI typecheck imports dist types)
        run: pnpm --filter @qira/qal-sdk build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit

      - name: Adversarial tests
        run: pnpm test:adversarial

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # Host-side program checks that do not need SBF platform tools.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (host)
        run: cargo clippy -p qal-anchor --all-targets -- -D warnings

      - name: Install Solana CLI + platform tools (stable)
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          export PATH="$SOLANA_BIN:$PATH"
          solana --version
          which cargo-build-sbf || ls "$SOLANA_BIN" | head -50
          cargo-build-sbf --version

      - name: Install Anchor 1.0.1
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor --tag v1.0.1 anchor-cli --locked --force
          anchor --version

      # Coherent ephemeral identity for compile/test only (not production deploy key).
      - name: Prepare ephemeral program identity
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          mkdir -p target/deploy
          solana-keygen new -o target/deploy/qal_anchor-keypair.json --no-bip39-passphrase -f
          ID=$(solana-keygen pubkey target/deploy/qal_anchor-keypair.json)
          echo "Ephemeral CI program ID: $ID"
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$ID\")/" programs/qal-anchor/src/lib.rs
          sed -i "s/qal_anchor = \"[^\"]*\"/qal_anchor = \"$ID\"/g" Anchor.toml
          grep declare_id programs/qal-anchor/src/lib.rs
          grep qal_anchor Anchor.toml

      - name: Anchor build (SBF)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          anchor build

      - name: Program LiteSVM tests
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.cargo/bin:$PATH"
          cargo test -p qal-anchor --test test_anchor -- --nocapture

      - name: Verifier build (lockfile-only, no network fallback)
        run: pnpm build:verifier

      - name: SDK + CLI build
        run: pnpm build

      - name: Production dependency audit (blocking)
        run: pnpm audit --prod
