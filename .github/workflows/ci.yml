name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck / lint
        run: pnpm typecheck && pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Solana + Anchor
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          cargo install --git https://github.com/coral-xyz/anchor --tag v1.0.1 anchor-cli --locked || true
          # Fallback: use avm if present
          which anchor || cargo install --git https://github.com/coral-xyz/anchor anchor-cli --tag v1.0.1 --force

      - name: Program keypair (ephemeral CI identity)
        run: |
          mkdir -p target/deploy
          solana-keygen new -o target/deploy/qal_anchor-keypair.json --no-bip39-passphrase -f
          # Note: CI builds with whatever keypair is generated unless declare_id matches.
          # For PR checks we still compile; deploy is not required in CI.
          solana-keygen pubkey target/deploy/qal_anchor-keypair.json

      - name: Build program (best effort if toolchain available)
        run: |
          if command -v anchor >/dev/null 2>&1; then
            anchor build || echo "anchor build failed — see logs"
            cargo test -p qal-anchor --test test_anchor || true
          else
            echo "anchor not available"
          fi

      - name: Verifier vendor build
        run: pnpm build:verifier

      - name: SDK/CLI build
        run: pnpm build
